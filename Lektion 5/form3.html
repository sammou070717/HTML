<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form>

<p>Attributet "disabled" för input betyder att fältet ska vara inaktiverat.</p>
<input type="text" id="fname" name="fname" value="john" disabled><br>

<p>Input-fält med intiala (standard) värden (value):</p>
<input type="text" id="fname" name="fname" value="Sammy mouatakef" size="30"><br>
<br><input type="color" value="#ff0000" size="30"> <br> 

<p> Attributet "readonly" för input specificerar att det endast kan läsas.</p>
<input type="text" id="fname" name="fname" placeholder="first name"><br>

</form>
</body>
</html>
